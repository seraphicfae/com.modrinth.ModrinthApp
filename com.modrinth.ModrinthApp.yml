id: com.modrinth.ModrinthApp

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
- org.freedesktop.Sdk.Extension.node26
- org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/node26/bin:/usr/lib/sdk/rust-stable/bin

command: modrinth-app
finish-args:
  - --filesystem=xdg-download:ro # allow drag and drop from downloads
  - --filesystem=xdg-run/app/com.discordapp.Discord:create # allows for discord rpc (flatpak)
  - --filesystem=xdg-run/discord-ipc-0 # allows for discord rpc
  # We can't use this yet, see <https://github.com/flatpak/flatpak/issues/5681>
  # So we have to use device=all
  # - --device=dri
  # - --device=input
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --env=MODRINTH_EXTERNAL_UPDATE_PROVIDER=1
  - --env=MODRINTH_APP_SOURCE=flatpak

rename-icon: ModrinthApp

modules:
  # For the in-game narrator
  - modules/flite/flite.yml

  # Used by TinyFileDialogs from LWJGL
  - modules/xprop/xprop.yml

  # Required for older versions of Minecraft
  - modules/xrandr.yml

  # pnpm isn't packaged by node26 extension
  - modules/pnpm.yml

  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  # Some controller mods require libusb (see https://github.com/isXander/Controlify/issues/31)
  # Indeed, it is already provided by the runtime

  # Helper script used to wrap instances with the proper configuration for dGPUs
  - name: prime-run
    buildsystem: simple
    build-commands:
      - install -Dm755 prime-run "$FLATPAK_DEST"/bin/prime-run
    sources:
      - type: file
        path: prime-run

  - name: ModrinthApp
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/ModrinthApp/cargo
        XDG_CACHE_HOME: /run/build/ModrinthApp/flatpak-node/cache
        CARGO_NET_OFFLINE: 'true'
        PNPM_CONFIG_TRUST_LOCKFILE: 'true'
        PNPM_CONFIG_STORE_DIR: /run/build/ModrinthApp/flatpak-node/pnpm-store
    sources:
    - type: git
      url: https://github.com/modrinth/code
      tag: v0.22.1
      commit: b3a202687e9a33e5f5da676ae7b62181a2011702
    - cargo-sources.json
    - node-sources.json
    - type: file
      path: com.modrinth.ModrinthApp.metainfo.xml
    - type: file
      path: com.modrinth.ModrinthApp.desktop
    build-commands:
    - pnpm install --offline --frozen-lockfile --trust-lockfile --force
    - cargo --offline fetch --manifest-path Cargo.toml --verbose
    - pnpm tauri build
    - install -Dm644 com.modrinth.ModrinthApp.desktop.desktop /app/share/applications/com.modrinth.ModrinthApp.desktop.desktop
    - install -Dm644 com.modrinth.ModrinthApp.metainfo.xml /app/share/metainfo/com.modrinth.ModrinthApp.metainfo.xml

  # Wrap the executable in a wrapper to run scripts before running it
  - name: wrapper
    buildsystem: simple
    build-commands:
      - mv $FLATPAK_DEST/bin/modrinth-app $FLATPAK_DEST/bin/modrinth-app-wrapped
      - install -Dm755 modrinth-app-wrapper.sh $FLATPAK_DEST/bin/modrinth-app
    sources:
      - type: file
        path: modrinth-app-wrapper.sh
